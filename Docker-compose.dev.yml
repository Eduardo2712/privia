version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: privia-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: privia
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - privia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: privia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - privia-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: privia-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - privia-network

  ollama:
    image: ollama/ollama
    container_name: privia-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_CTX: 2048
      OLLAMA_KEEP_ALIVE: -1
    networks:
      - privia-network

  qdrant:
    image: qdrant/qdrant
    container_name: privia-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - privia-network

  minio:
    image: minio/minio
    container_name: privia-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    networks:
      - privia-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: privia-api
    restart: unless-stopped
    working_dir: /usr/src/app
    ports:
      - "8080:8080"
    env_file:
      - ./api/.env
    environment:
      AI_URL: http://ollama:11434/api/generate
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - privia-network

volumes:
  postgres_data:
  redisinsight_data:
  ollama_data:
  qdrant_data:
  minio_data:

networks:
  privia-network:
    driver: bridge
