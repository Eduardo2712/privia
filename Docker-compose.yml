version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: privia-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: privia
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - privia-network
    mem_limit: 1g
    cpus: 1.0

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: privia-api
    restart: always
    working_dir: /usr/src/app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - ollama
    env_file:
      - ./api/.env
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - privia-network
    environment:
      - AI_URL=http://ollama:11434/api/generate
    mem_limit: 2g
    cpus: 2.0

  redis:
    image: redis:7
    container_name: privia-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - privia-network
    mem_limit: 512m
    cpus: 0.5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: privia-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - privia-network
    mem_limit: 512m
    cpus: 0.5

  ollama:
    image: ollama/ollama
    container_name: privia-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_CTX=2048
      - OLLAMA_NUM_GPU=0
    networks:
      - privia-network
    mem_limit: 6g

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redisinsight_data:
  ollama_data:
  qdrant_data:

networks:
  privia-network:
    driver: bridge
