services:
  postgres:
    image: postgres:16
    container_name: privia-postgres
    restart: always
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: privia
      POSTGRES_USER: privia
      POSTGRES_PASSWORD: privia
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: privia-redis
    restart: always
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama
    container_name: privia-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull qwen2.5:7b-instruct &&
      ollama pull bge-m3 &&
      wait
      "

  qdrant:
    image: qdrant/qdrant
    container_name: privia-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio
    container_name: privia-minio
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data

  api:
    build: ./api
    image: privia-api
    container_name: privia-api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AI_URL: http://ollama:11434
      REDIS_HOST: redis
      DB_HOST: postgres

  web:
    build: ./web
    image: privia-web
    container_name: privia-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  minio_data:
