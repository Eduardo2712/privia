services:
  postgres:
    image: postgres:16
    container_name: privia-postgres
    restart: always
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: privia
      POSTGRES_USER: privia
      POSTGRES_PASSWORD: privia
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - privia-network

  redis:
    image: redis:7
    container_name: privia-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - privia-network

  ollama:
    image: ollama/ollama
    container_name: privia-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - privia-network

  qdrant:
    image: qdrant/qdrant
    container_name: privia-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - privia-network

  minio:
    image: minio/minio
    container_name: privia-minio
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    networks:
      - privia-network

  api:
    build:
      context: ./api
      dockerfile: dockerfile
    image: privia-api:latest
    container_name: privia-api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - privia-network

  web:
    build: ./web
    image: privia-web
    container_name: privia-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_URL_API: "http://192.168.18.100:8080"
      NEXT_PUBLIC_URL_SOCKET: "http://192.168.18.100:8080"
      INTERNAL_URL_API: "http://api:8080"
      INTERNAL_URL_API_SOCKET: "http://api:8080"
    depends_on:
      - api
    networks:
      - privia-network

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  minio_data:

networks:
  privia-network:
    driver: bridge
