services:
  postgres:
    image: postgres:16
    container_name: privia-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - privia-network

  redis:
    image: redis:7
    container_name: privia-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - privia-network

  ollama:
    image: ollama/ollama
    container_name: privia-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - privia-network

  qdrant:
    image: qdrant/qdrant
    container_name: privia-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - privia-network

  minio:
    image: minio/minio
    container_name: privia-minio
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - privia-network

  api:
    build:
      context: ./api
      dockerfile: dockerfile
    image: privia-api:latest
    container_name: privia-api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "sleep 5 && node dist/main.js"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s 
    networks:
      - privia-network

  web:
    build: ./web
    image: privia-web
    container_name: privia-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - privia-network

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  minio_data:

networks:
  privia-network:
    driver: bridge